# Attach each package's tarball to a GitHub Release, so the packages can be
# installed by anyone, today, from a URL.
#
# This exists because for thirteen days NOTES-FOR-HUMAN.md has said that an
# unpublished package "cannot be installed by anyone", and that is not true.
# This repository is public and MIT licensed, the three packages have no runtime
# dependencies, and `npm pack` produces a self-contained tarball. npm installs a
# tarball from an https URL without a registry, an account or a token:
#
#   npm i https://github.com/LoganChu/Agent_Playground/releases/download/us-state-tax-v0.15.0/us-state-tax-0.15.0.tgz
#
# So the npm ask in NOTES-FOR-HUMAN.md is now an ask about REACH — a name people
# can search for, and `npm i us-state-tax` — rather than about whether the work
# is usable at all. Nothing here replaces it; this only removes the floor.
#
# The only credential used is the GITHUB_TOKEN that Actions mints for this run.
# There is no secret to add.
name: Distribute

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'site/**'
      - '.github/workflows/dist.yml'
  workflow_dispatch:

# One release per package VERSION, at an immutable tag. npm caches a remote
# tarball by its URL, so a rolling "latest" tag would hand a cached user stale
# bytes under a URL that promised otherwise. A version in the tag is the only
# honest form.
permissions:
  contents: write

concurrency:
  group: distribute
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # An install line that names a version is a promise, and a promise in a
      # README rots silently. This is the only mechanism that keeps the four
      # READMEs honest across a version bump, so it runs before anything is
      # built and it fails the release rather than warning about it.
      - name: Refuse to release if a README still advertises an older version
        run: |
          set -euo pipefail
          stale=0
          for name in us-federal-tax us-state-tax us-tax-mcp; do
            version="$(node -p "require('./packages/$name/package.json').version")"
            want="releases/download/$name-v$version/$name-$version.tgz"
            for doc in README.md packages/$name/README.md; do
              if grep -q "releases/download/$name-v" "$doc" && ! grep -qF "$want" "$doc"; then
                echo "::error file=$doc::$doc links a $name tarball that is not $version"
                stale=1
              fi
            done
          done
          [ "$stale" -eq 0 ] || exit 1

      - name: Build, test and pack every package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packs"
          for name in us-federal-tax us-state-tax us-tax-mcp; do
            echo "::group::$name"
            (
              cd "packages/$name"
              npm install
              npm run typecheck
              # Nothing is offered for installation that has not just passed its
              # own suite in this same checkout.
              npm test
              npm pack --pack-destination "$RUNNER_TEMP/packs"
            )
            echo "::endgroup::"
          done
          ls -l "$RUNNER_TEMP/packs"

      - name: Release any version that does not already have one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          created=0
          for name in us-federal-tax us-state-tax us-tax-mcp; do
            version="$(node -p "require('./packages/$name/package.json').version")"
            tag="$name-v$version"
            tarball="$RUNNER_TEMP/packs/$name-$version.tgz"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released; leaving it alone"
              continue
            fi
            url="https://github.com/${{ github.repository }}/releases/download/$tag/$name-$version.tgz"
            {
              echo "\`$name@$version\`, built and tested from \`${{ github.sha }}\`."
              echo
              echo "Install it without a registry, an account or a token:"
              echo
              echo '```bash'
              echo "npm i $url"
              echo '```'
              if [ "$name" = "us-tax-mcp" ]; then
                echo
                echo "Or run the MCP server straight from the tarball:"
                echo
                echo '```bash'
                echo "npx -y $url"
                echo '```'
              fi
              echo
              echo "Zero runtime dependencies. See the repository README for what is in it."
            } > "$RUNNER_TEMP/notes-$name.md"
            gh release create "$tag" "$tarball" \
              --title "$name v$version" \
              --notes-file "$RUNNER_TEMP/notes-$name.md"
            echo "released $tag"
            created=$((created + 1))
          done
          echo "created $created release(s)"

      # The calculator, as ONE file that works when you double-click it.
      #
      # Day 21 told the human the Pages artifact "works offline — open
      # index.html". It does not: a <script type="module"> loaded from a file://
      # URL is blocked by CORS in every Chromium browser, and the page comes up
      # blank. `site/build.mjs` now also emits a single self-contained HTML file
      # with all 46 modules inlined, which does work, and this attaches it to a
      # release so that the calculator has a distribution that waits on nobody.
      #
      # Deliberately a ROLLING tag, where every package tarball above gets an
      # immutable one. That rule exists because npm caches a remote tarball by
      # its URL, so a moving "latest" would hand a cached user stale bytes under
      # a URL that promised otherwise. A browser downloading an HTML file has no
      # such contract, and for a person the useful link is the one that always
      # means "the current calculator". The release notes carry the commit.
      - name: Build the single-file calculator and refresh its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd site && npm test)
          file=site/dist/retirement-tax-calculator.html
          test -s "$file"
          {
            echo "The retirement tax calculator as **one file**, built and tested from \`${{ github.sha }}\`."
            echo
            echo "Download it and open it. No server, no install, no network — the whole"
            echo "computation runs in the page, and nothing is sent anywhere."
            echo
            echo "It works out the federal return from what a household *receives* and then"
            echo "ranks all 28 supported states at once, pricing every Maryland and Indiana"
            echo "county, and tells a couple what filing their retirement income in one"
            echo "name rather than both would cost them."
            echo
            echo "This tag moves with \`main\`. Not tax advice."
          } > "$RUNNER_TEMP/notes-calculator.md"
          if gh release view calculator >/dev/null 2>&1; then
            gh release upload calculator "$file" --clobber
            gh release edit calculator --notes-file "$RUNNER_TEMP/notes-calculator.md" \
              --title "Retirement tax calculator (one file)"
            echo "refreshed the calculator release"
          else
            gh release create calculator "$file" \
              --title "Retirement tax calculator (one file)" \
              --notes-file "$RUNNER_TEMP/notes-calculator.md"
            echo "created the calculator release"
          fi

  # Install the packages the way a stranger would, from the URLs the READMEs
  # advertise, and check that they work.
  #
  # ## Why this is a separate job and not a test
  #
  # Day 20 put an install line in four READMEs. **Seventeen days later nothing
  # had ever run it.** Day 37 ran it by hand: it worked, and the first call
  # written against the installed package returned a total tax of $0 on a
  # household with $180,000 of wages, because the field is `w2Wages` and the
  # call said `wages`. Every one of this repository's 1,143 tests was green
  # throughout, and none of them could have been otherwise: they all import from
  # a relative path inside a checkout that has just been built.
  #
  # **A suite tests the code; only an install tests the product.** A missing
  # `files` entry, a broken `exports` map, a `bin` that is not executable, a
  # tarball that was never uploaded, a README advertising a version that does
  # not exist, a vendored engine that did not get copied — none of those can
  # fail a test that never leaves the checkout, and every one of them is what a
  # user meets first.
  #
  # It runs AFTER `distribute`, because the release URLs it fetches are the ones
  # that job just created. It needs the network, which is why it is not part of
  # any package's `npm test`.
  smoke:
    needs: distribute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Deliberately NO `npm install` and NO build. The point is an empty
      # machine with the install line, so anything the packages need and do not
      # declare fails here rather than passing on a developer's full checkout —
      # which is the same mistake the `counts` job in ci.yml made with a global
      # `tsc`, found on the same day.
      - name: Install from the release URLs and exercise all three packages
        env:
          SMOKE_REPO: ${{ github.repository }}
        run: node tools/smoke/install-from-release.mjs
