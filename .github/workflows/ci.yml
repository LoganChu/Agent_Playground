name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          # The MCP server vendors both engines' sources at build time, so it is
          # built and tested from the same checkout rather than from a release.
          - us-federal-tax
          - us-state-tax
          - us-tax-mcp
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  # The differential test against PolicyEngine-US, as a guard on every push.
  #
  # Only the cheap half runs here. PolicyEngine's answers for the 437 households
  # are COMMITTED in `tools/differential/out/theirs.json`, and regenerating this
  # project's side takes three seconds, so a push can be checked against an
  # independent model for the price of a `node` invocation. The ten-minute
  # PolicyEngine pass stays manual and is only needed when the grid changes.
  #
  # The assertion is a golden file and deliberately strict: regenerate all three
  # artefacts and require that nothing changed. That fails on a NEW unexplained
  # difference, which is the case it exists for — and it also fails when one is
  # FIXED, because Day 24 is what happens when a classification is allowed to go
  # stale: four reasons in `known-divergences.json` said the caller had to supply
  # a pension the engine had started supplying itself, and five unrelated defects
  # sat behind them being reported as explained. A report that is allowed to
  # drift from its own code is worth less than no report.
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build both engines
        run: |
          (cd packages/us-federal-tax && npm install && npm run build)
          (cd packages/us-state-tax   && npm install && npm run build)
      - name: Regenerate the cases, this project's answers and the report
        run: |
          node tools/differential/cases-to-json.mjs > tools/differential/out/cases.json
          node tools/differential/ours.mjs          > tools/differential/out/ours.json
          node tools/differential/compare.mjs       > tools/differential/REPORT.md
      - name: Require the committed report to match the code that produced it
        run: |
          if ! git diff --quiet tools/differential/; then
            echo "::error::The differential report is out of date. Run the four commands in"
            echo "::error::tools/differential/README.md and commit the result. The diff follows."
            git --no-pager diff --stat tools/differential/
            git --no-pager diff tools/differential/REPORT.md
            exit 1
          fi
          echo "Differential report matches. $(grep -o '\*\*[0-9,]* agree to the dollar\*\*' tools/differential/REPORT.md)"

  # The test counts the README advertises, checked against the runner.
  #
  # Day 36: `packages/us-tax-mcp/test/readme.test.js` claimed to be "deliberately
  # brittle" about three counts in the README and was comparing them to three
  # literals copied out of the README. It had never fired; the suites had grown
  # from 283/51/97 to 369/581/159 underneath it. A suite cannot count itself, so
  # the measurement runs here, where the runners can be invoked.
  #
  # ## And then this job was red for five pushes and nobody looked
  #
  # Day 37 found it, by reading the Actions tab for the first time in a while
  # rather than by running anything. This job installed `us-tax-mcp` and nothing
  # else, and `tools/test-counts.mjs` runs `npm test` in all four directories —
  # which is `npm run build && node --test`, and the build needs the local
  # `typescript`. So `packages/us-federal-tax`'s build died with `tsc: not
  # found`, there was no TAP summary to read, and the job threw on the first
  # directory it touched. Every run since Day 36 took 20 seconds and measured
  # nothing.
  #
  # Locally it passed, every time, because a run that has just built all four
  # packages by hand has all four `node_modules` already there. **An instrument
  # that works on a developer's machine because of state the developer happens
  # to have is not installed in CI, it is coincidentally satisfied there** — and
  # the mechanism built to stop a number going stale had never once executed.
  #
  # Two fixes, because the cause and the symptom are different problems: install
  # every directory the tool measures (below), and make the tool name the reason
  # it found no TAP summary instead of reporting the absence (see
  # `tools/test-counts.mjs`).
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Every directory `tools/test-counts.mjs` measures, in the order it
      # measures them. Adding a package to `PACKAGES` there and not here is the
      # same defect again, which is why the tool's error now says so by name.
      - name: Install every suite's dependencies
        run: |
          for dir in packages/us-federal-tax packages/us-state-tax packages/us-tax-mcp site; do
            echo "::group::npm install $dir"
            (cd "$dir" && npm install)
            echo "::endgroup::"
          done
      - name: Measure every suite and check the README and the committed record
        run: node tools/test-counts.mjs --check

  # Is the mutation score this repository advertises a score of this repository?
  #
  # Day 33 made "how sensitive are the tests" a measured number. Day 35 said a
  # score may not be inferred, Day 36 said it may not be inherited — and all
  # three left the enforcement to a future run remembering. Day 37 found the
  # bill: README.md advertised the federal package at 698 mutants for a day
  # after the committed, measured figure became 711, because the mutation
  # numbers were the last advertised measurements here that a human copied by
  # hand.
  #
  # Running the audits takes hours and stays weekly (mutation.yml), writing
  # tools/mutation/scores.json with --record. This job costs a build and answers
  # the cheap half on every push: do the documents agree with the record, and
  # was the record measured over THIS build? The second is new — it makes "the
  # audit was re-run after that edit" a check rather than a sentence in a
  # journal.
  mutation-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the packages the record covers
        run: |
          for dir in packages/us-federal-tax packages/us-state-tax; do
            (cd "$dir" && npm install)
          done
      - name: Check every advertised mutation score against the record and this build
        run: node tools/mutation/check-scores.mjs --check
