# The LEVELS audit, on a schedule rather than on every push.
#
# `tools/mutation/mutate.mjs` sets every number in a built package wrong, one at a
# time, and runs the suite. The federal package is minutes; the state package is
# about an hour and three quarters as of v0.32.0, because its suite now carries two
# coverage proofs that ask this audit's question on every push. Far too slow for a
# push either way, and cheap for a week.
#
# ## Why it is a ratchet, and why that is defensible here
#
# Day 31's rule says a bound derived from a measurement is a ratchet that locks in
# whatever was true the day it was written. `--max-survivors 0` looks exactly like
# one. The difference is what the number means: 0 is not where the package happened
# to land, it is the only value with an argument behind it — every parameter has a
# test that fails when it is wrong. Any other number would need a list of which
# parameters are exempt and why, and that list is `STATE-SURVIVORS.md` for the
# package that still has one.
#
# So `us-federal-tax` runs at 0. `us-state-tax` ran without a limit until Day 35,
# when the last survivor that was a missing test was closed: the ones that remain are
# windows on a tax year outside the two supported, an epsilon used as notation, one
# row of Ohio arithmetic no return can reach, and two New Mexico figures no shipped
# answer reads — each with a written reason in `STATE-SURVIVORS.md`. That list is the
# argument a non-zero limit needs and 0 does not, so the job gates at the size of the
# list: it fails on a regression and passes on the known set.
#
# Several become reachable the day this package gains a third tax year, and on that
# day the gate drops with them. Raising either number is a deliberate edit to this
# file, which is the point: it cannot drift, only be changed on purpose.
#
# ## DAY 80 — AND "IT CANNOT DRIFT" WAS WRONG IN THE DIRECTION THAT MATTERS
#
# It cannot drift SILENTLY UPWARD, which is what the sentence above was about. It
# can go stale downward, and it did: this paragraph said "the six that remain" and
# gated at 6 from Day 35, the count became EIGHT on Day 70 when New Mexico arrived
# with two declared-unreachable figures, and the limit, the job name and these very
# sentences all still said six. The job therefore failed on every completed run from
# then until Day 80 — and nothing here read it, because `tools/last-ci-run.mjs`
# watched only the workflow named `CI` and this one is a weekly schedule.
#
# A number with an argument behind it needs the argument to be re-read when the
# number moves. Three places said six and the list said eight; the list was right.
# `last-ci-run.mjs` now checks every active workflow, which is what would have
# caught it in a day rather than in five.
name: Mutation audit

on:
  schedule:
    # 04:17 UTC on Mondays. Not on the hour, because everything is on the hour.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federal:
    name: us-federal-tax (must stay at zero survivors)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: cd packages/us-federal-tax && npm install && npm run build
      - name: Audit
        run: |
          set -euo pipefail
          node tools/mutation/mutate.mjs packages/us-federal-tax \
            --workers 4 --max-survivors 0 --record "$RUNNER_TEMP/scores.json" | tee "$GITHUB_STEP_SUMMARY"
      # The fresh record, printed so a run that MOVED the score says what the
      # committed `tools/mutation/scores.json` should become. Not committed from
      # here: a changed score means survivors to re-triage or a package that
      # changed shape, and both want a human or an agent reading the survivor
      # list rather than a bot rewriting a number. `ci.yml`'s `mutation-claims`
      # job is what fails, on every push, if the committed record stops matching
      # the build — so a stale record cannot sit here unnoticed for a week.
      - name: Print the fresh record
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/scores.json" ]; then
            {
              echo
              echo '### The record this run measured'
              echo
              echo 'If this differs from `tools/mutation/scores.json`, that file is what needs updating.'
              echo
              echo '```json'
              cat "$RUNNER_TEMP/scores.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  state:
    name: us-state-tax (must stay at eight triaged survivors)
    runs-on: ubuntu-latest
    # 120 rather than 45 as of v0.32.0, and the reason is a trade worth naming.
    # This job's cost is (number of mutants) x (how long the suite takes), and the
    # suite got slower on purpose: the two coverage proofs in `status-sweep` and
    # `step-probes` perturb 1,125 parameters between them on every push, which is
    # this audit's own question asked in a second instead of in two hours. Every
    # finding since Day 33 came from those, and this job confirms the number.
    #
    # A workflow that times out teaches the reader to ignore Actions, which costs
    # more than the thing it is complaining about — the same argument as the state
    # job running unguarded until its survivors are triaged. Measured at roughly
    # 100 minutes on four cores; 120 is the measurement plus room, and it is a
    # deliberate edit rather than a default.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: cd packages/us-state-tax && npm install && npm run build
      # The locality registries are excluded: 1,033 municipal rates cannot each
      # have a test, so mutating them measures the registry's size rather than the
      # suite's reach. See tools/mutation/README.md.
      - name: Audit the rule parameters
        run: |
          set -euo pipefail
          # DAY 80 — THE LIMIT WAS 6 AND THE TRIAGED COUNT HAS BEEN 8 SINCE DAY 70,
          # SO THIS JOB HAS FAILED ON EVERY COMPLETED RUN SINCE AND NOBODY READ IT.
          #
          # The two extra survivors are `states/new-mexico.js` 115 and 206, which
          # arrived with New Mexico and were DECLARED BEFORE THE AUDIT EVER SAW
          # THEM — they are in `step-probes.test.js`'s `UNREACHABLE` list, written
          # on Day 69 with the arithmetic for why no shipped answer can read
          # either figure. `STATE-SURVIVORS.md` has recorded "the same eight" for
          # six consecutive complete runs (seven, after today) and says all eight
          # are "unreachable by construction, each for a documented reason".
          #
          # So the stale thing was the threshold, not the code, and raising it is
          # what `mutate.mjs`'s own failure message instructs: "raise the limit
          # with a reason in the workflow that sets it." This is the reason. The
          # job's NAME said six as well, which is the part that should have made
          # this obvious, and it now says eight.
          #
          # Why it went unread for five days: `tools/preflight.mjs` and the
          # journals check CI through `tools/last-ci-run.mjs`, which reads
          # `ci.yml` only. This workflow runs on a weekly SCHEDULE and is in
          # nobody's path. A gate on a different trigger is a gate on a different
          # planet — the same shape as every other finding today, where the thing
          # that was right (the job name, the note, the guard's own name) was the
          # thing nothing looked at.
          node tools/mutation/mutate.mjs packages/us-state-tax --workers 4 \
            --max-survivors 8 --record "$RUNNER_TEMP/scores.json" \
            --skip localities/ohio.js,localities/ohio-school-districts.js,localities/indiana.js,localities/michigan.js,localities/maryland.js,localities/new-york.js,localities/counties.js \
            | tee "$GITHUB_STEP_SUMMARY"
      # The fresh record, printed so a run that MOVED the score says what the
      # committed `tools/mutation/scores.json` should become. Not committed from
      # here: a changed score means survivors to re-triage or a package that
      # changed shape, and both want a human or an agent reading the survivor
      # list rather than a bot rewriting a number. `ci.yml`'s `mutation-claims`
      # job is what fails, on every push, if the committed record stops matching
      # the build — so a stale record cannot sit here unnoticed for a week.
      - name: Print the fresh record
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/scores.json" ]; then
            {
              echo
              echo '### The record this run measured'
              echo
              echo 'If this differs from `tools/mutation/scores.json`, that file is what needs updating.'
              echo
              echo '```json'
              cat "$RUNNER_TEMP/scores.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
